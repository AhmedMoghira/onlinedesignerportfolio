<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#022f38"/>
      <stop offset="100%" stop-color="#0f747f"/>
    </linearGradient>
    <linearGradient id="canBody" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3dc2d1"/>
      <stop offset="25%" stop-color="#6bdbeb"/>
      <stop offset="100%" stop-color="#116f79"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d8fbff"/>
      <stop offset="100%" stop-color="#6aa4b0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <g font-family="Arial, Helvetica, sans-serif">
